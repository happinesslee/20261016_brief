<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAILY MACRO INTELLIGENCE BRIEF</title>
  <!-- Google Fonts: Gowun Dodum & JetBrains Mono for tabular numbers -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=JetBrains+Mono:wght@400;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-paper: #FBFBFB;
      --bg-subtle: #F3F3F3;
      --bg-box: #F7F7F7;
      --text-primary: #1A1A1A;
      --text-secondary: #4A4A4A;
      --text-muted: #757575;
      --accent-black: #000000;
      --border-light: #E5E5E5;
      --border-dark: #1A1A1A;
      --font-body: 'Gowun Dodum', -apple-system, BlinkMacSystemFont, "Malgun Gothic", serif;
      --font-Display: 'Noto Serif KR', 'Gowun Dodum', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-paper);
      color: var(--text-primary);
      font-family: var(--font-body);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      padding: 2rem 1.25rem 4rem;
    }

    .newspaper-container {
      max-width: 1180px;
      margin: 0 auto;
      border-top: 4px solid var(--accent-black);
      padding-top: 0.5rem;
    }

    /* 1. Masthead / Header */
    .masthead {
      text-align: center;
      border-top: 1px solid var(--accent-black);
      border-bottom: 4px double var(--accent-black);
      padding: 1.5rem 0 1.25rem;
      margin-bottom: 2rem;
    }

    .masthead-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 0.65rem;
      margin-bottom: 1.2rem;
      font-family: var(--font-mono);
    }

    .masthead-title {
      font-family: var(--font-Display);
      font-size: clamp(1.85rem, 4vw, 3.1rem);
      font-weight: 700;
      color: var(--accent-black);
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }

    .masthead-subtitle {
      font-size: 0.92rem;
      color: var(--text-secondary);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Section Header Common */
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 2px solid var(--accent-black);
      padding-bottom: 0.45rem;
      margin-bottom: 1.25rem;
    }

    .section-title {
      font-family: var(--font-Display);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--accent-black);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title::before {
      content: "■";
      font-size: 0.75rem;
    }

    .section-caption {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* 2. Macro Core Highlights (3-Column Newspaper Grid) */
    .highlights-section {
      margin-bottom: 2.5rem;
    }

    .highlights-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--border-dark);
    }

    .highlight-card {
      padding: 0.5rem 1.5rem 1.5rem;
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .highlight-card:first-child {
      padding-left: 0;
    }

    .highlight-card:last-child {
      border-right: none;
      padding-right: 0;
    }

    .highlight-rank {
      font-family: var(--font-mono);
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--accent-black);
      line-height: 1;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 0.4rem;
      display: inline-block;
      width: fit-content;
    }

    .highlight-title {
      font-family: var(--font-Display);
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--accent-black);
      line-height: 1.4;
      word-break: keep-all;
    }

    .highlight-summary {
      font-size: 0.93rem;
      color: var(--text-secondary);
      line-height: 1.65;
      word-break: keep-all;
    }

    /* 3. Market Indicators Table / Strip */
    .indicators-section {
      margin-bottom: 2.75rem;
    }

    .indicators-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--border-dark);
      background-color: #FFFFFF;
    }

    .indicator-cell {
      padding: 1.15rem 1.25rem;
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .indicator-cell:last-child {
      border-right: none;
    }

    .indicator-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .indicator-name {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    /* Minimal Monochrome Badge */
    .indicator-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    /* UP: Filled solid black block with white text */
    .badge-up {
      background-color: var(--accent-black);
      color: #FFFFFF;
      border: 1px solid var(--accent-black);
    }

    /* DOWN: Outlined crisp white/gray block with black text */
    .badge-down {
      background-color: transparent;
      color: var(--accent-black);
      border: 1px solid var(--accent-black);
    }

    .indicator-value {
      font-family: var(--font-mono);
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--accent-black);
      letter-spacing: -0.02em;
    }

    .indicator-delta {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: flex;
      gap: 0.5rem;
    }

    /* 4. Top 5 Intelligence Cards */
    .intelligence-section {
      margin-bottom: 3rem;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.75rem;
    }

    /* Make the 1st lead story span full width (2 columns) on desktop like a front-page lead article */
    .news-card:first-child {
      grid-column: 1 / -1;
    }

    .news-card {
      border: 1px solid var(--border-dark);
      background-color: #FFFFFF;
      padding: 1.6rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .news-card-header {
      border-bottom: 2px solid var(--border-light);
      padding-bottom: 0.9rem;
    }

    .news-meta {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.35rem;
      display: block;
    }

    .news-headline {
      font-family: var(--font-Display);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-black);
      line-height: 1.4;
      word-break: keep-all;
    }

    .news-card:first-child .news-headline {
      font-size: 1.45rem;
    }

    .news-card-body {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    .news-card:first-child .news-card-body {
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    .sub-block {
      padding: 0.9rem 1rem;
      border: 1px solid var(--border-light);
      background-color: var(--bg-paper);
    }

    .sub-block-label {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent-black);
      margin-bottom: 0.55rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 0.35rem;
    }

    /* 4-1. Observed Facts */
    .facts-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .facts-list li {
      font-size: 0.9rem;
      color: var(--text-primary);
      padding-left: 1rem;
      position: relative;
      word-break: keep-all;
    }

    .facts-list li::before {
      content: "▪";
      position: absolute;
      left: 0;
      color: var(--accent-black);
    }

    /* 4-2. Transmission Pathway */
    .pathway-block {
      background-color: var(--bg-subtle);
      border-left: 3px solid var(--accent-black);
    }

    .pathway-steps {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.65rem;
    }

    .pathway-node {
      background-color: #FFFFFF;
      border: 1px solid var(--border-dark);
      padding: 0.25rem 0.55rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-black);
    }

    .pathway-arrow {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .pathway-impact {
      font-size: 0.88rem;
      color: var(--text-secondary);
      border-top: 1px dashed var(--border-light);
      padding-top: 0.5rem;
      word-break: keep-all;
    }

    .pathway-impact strong {
      color: var(--accent-black);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      margin-right: 0.35rem;
    }

    /* 4-3. Falsification Criteria */
    .falsification-block {
      border: 1px dashed var(--border-dark);
      background-color: #FFFFFF;
    }

    .falsification-text {
      font-size: 0.88rem;
      color: var(--text-secondary);
      word-break: keep-all;
    }

    /* 4-4. Analyst Tip */
    .analyst-block {
      background-color: var(--accent-black);
      color: #FFFFFF;
      padding: 0.85rem 1.05rem;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }

    .news-card:first-child .analyst-block {
      grid-column: 1 / -1;
    }

    .analyst-badge {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background-color: #FFFFFF;
      color: var(--accent-black);
      padding: 0.15rem 0.45rem;
      white-space: nowrap;
      margin-top: 0.15rem;
    }

    .analyst-text {
      font-size: 0.9rem;
      line-height: 1.55;
      color: #F5F5F5;
      word-break: keep-all;
    }

    /* 5. Footer */
    .report-footer {
      border-top: 4px double var(--accent-black);
      padding-top: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .footer-meta {
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .footer-disclaimer {
      max-width: 620px;
      text-align: right;
      line-height: 1.5;
      word-break: keep-all;
    }

    /* 6. Loading Skeleton & Error Fallback UI (Monochrome Editorial Style) */
    .is-hidden {
      display: none !important;
    }

    @keyframes skeletonPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.38; }
    }

    .status-container {
      margin: 1rem 0 2.5rem;
    }

    .loader-banner {
      border: 1px solid var(--border-dark);
      background-color: #FFFFFF;
      padding: 0.9rem 1.25rem;
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .loader-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      color: var(--accent-black);
    }

    .loader-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-black);
      display: inline-block;
      animation: skeletonPulse 1s infinite ease-in-out;
    }

    .skeleton-block {
      background-color: #E6E6E6;
      animation: skeletonPulse 1.5s infinite ease-in-out;
    }

    .skeleton-masthead {
      text-align: center;
      border-top: 1px solid var(--accent-black);
      border-bottom: 4px double var(--accent-black);
      padding: 1.5rem 0 1.25rem;
      margin-bottom: 2rem;
    }

    .skeleton-line {
      height: 0.95rem;
      margin-bottom: 0.6rem;
      background-color: #E6E6E6;
      animation: skeletonPulse 1.5s infinite ease-in-out;
    }

    .skeleton-title {
      height: 2.4rem;
      width: 65%;
      margin: 0.8rem auto;
      background-color: #DCDCDC;
      animation: skeletonPulse 1.5s infinite ease-in-out;
    }

    .skeleton-subtitle {
      height: 0.85rem;
      width: 42%;
      margin: 0 auto;
      background-color: #E6E6E6;
      animation: skeletonPulse 1.5s infinite ease-in-out;
    }

    .skeleton-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-dark);
    }

    .skeleton-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .skeleton-card {
      border: 1px solid var(--border-light);
      background-color: #FFFFFF;
      padding: 1.25rem;
    }

    /* Error Fallback Box */
    .error-fallback {
      border: 2px solid var(--accent-black);
      background-color: #FFFFFF;
      padding: 2.5rem 2rem;
      margin: 2rem 0 3rem;
      text-align: center;
    }

    .error-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background-color: var(--accent-black);
      color: #FFFFFF;
      padding: 0.25rem 0.65rem;
      margin-bottom: 1rem;
    }

    .error-title {
      font-family: var(--font-Display);
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--accent-black);
      margin-bottom: 0.65rem;
      word-break: keep-all;
    }

    .error-desc {
      font-size: 0.95rem;
      color: var(--text-secondary);
      max-width: 560px;
      margin: 0 auto 1rem;
      word-break: keep-all;
    }

    .error-detail {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      background-color: var(--bg-subtle);
      border: 1px dashed var(--border-dark);
      padding: 0.6rem 1rem;
      max-width: 520px;
      margin: 0 auto 1.5rem;
      word-break: break-all;
    }

    .retry-button {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background-color: var(--accent-black);
      color: #FFFFFF;
      border: 1px solid var(--accent-black);
      padding: 0.65rem 1.4rem;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .retry-button:hover {
      background-color: #FFFFFF;
      color: var(--accent-black);
    }

    /* Responsive Media Queries */
    @media (max-width: 960px) {
      .highlights-grid,
      .skeleton-grid-3 {
        grid-template-columns: 1fr;
      }

      .highlight-card {
        padding: 1rem 0;
        border-right: none;
        border-bottom: 1px solid var(--border-light);
      }

      .highlight-card:last-child {
        border-bottom: none;
      }

      .indicators-grid,
      .skeleton-grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }

      .indicator-cell:nth-child(2) {
        border-right: none;
      }

      .indicator-cell:nth-child(1),
      .indicator-cell:nth-child(2) {
        border-bottom: 1px solid var(--border-light);
      }

      .news-grid {
        grid-template-columns: 1fr;
      }

      .news-card:first-child .news-card-body {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem 0.85rem 3rem;
      }

      .masthead-top-bar,
      .loader-banner {
        flex-direction: column;
        gap: 0.35rem;
        text-align: center;
      }

      .indicators-grid,
      .skeleton-grid-4 {
        grid-template-columns: 1fr;
      }

      .indicator-cell {
        border-right: none !important;
        border-bottom: 1px solid var(--border-light);
      }

      .indicator-cell:last-child {
        border-bottom: none;
      }

      .news-card {
        padding: 1.15rem;
      }

      .analyst-block {
        flex-direction: column;
        gap: 0.45rem;
      }

      .report-footer {
        flex-direction: column;
      }

      .footer-disclaimer {
        text-align: left;
      }
    }
  </style>
</head>
<body>

  <main class="newspaper-container">
    <!-- 비동기 로딩 스켈레톤 및 에러 상태 표시 영역 -->
    <div id="status-container" class="status-container"></div>

    <!-- 실제 리포트 본문 컨테이너 -->
    <div id="report-content" class="is-hidden">
      <!-- 1. 발행 헤더 (Masthead) -->
      <header class="masthead" id="masthead-container"></header>

      <!-- 2. 오늘의 핵심 3가지 (Macro Core Highlights) -->
      <section class="highlights-section">
        <div class="section-header">
          <h2 class="section-title">01 / Macro Core Highlights</h2>
          <span class="section-caption">EXECUTIVE SUMMARY</span>
        </div>
        <div class="highlights-grid" id="highlights-container"></div>
      </section>

      <!-- 3. 시장 지표 테이블 (Market Indicators Table) -->
      <section class="indicators-section">
        <div class="section-header">
          <h2 class="section-title">02 / Key Market Indicators</h2>
          <span class="section-caption">REAL-TIME SNAPSHOT</span>
        </div>
        <div class="indicators-grid" id="indicators-container"></div>
      </section>

      <!-- 4. 오늘의 주요 뉴스 5건 (Top 5 Intelligence Cards) -->
      <section class="intelligence-section">
        <div class="section-header">
          <h2 class="section-title">03 / Top 5 Intelligence Dispatches</h2>
          <span class="section-caption">STRUCTURED ANALYST ASSESSMENT</span>
        </div>
        <div class="news-grid" id="news-container"></div>
      </section>

      <!-- 5. 푸터 (Footer) -->
      <footer class="report-footer" id="footer-container"></footer>
    </div>
  </main>

  <script>
    /**
     * 1. 로딩(Loading) 스켈레톤 UI 렌더링
     */
    function showLoadingState() {
      const statusEl = document.getElementById('status-container');
      const reportContentEl = document.getElementById('report-content');

      reportContentEl.classList.add('is-hidden');
      statusEl.classList.remove('is-hidden');

      statusEl.innerHTML = `
        <div class="loader-banner" role="status" aria-live="polite">
          <span class="loader-indicator">
            <span class="loader-dot"></span>
            SYNCHRONIZING LATEST INTELLIGENCE DISPATCH (data.json)...
          </span>
          <span>CACHE-BUSTING ACTIVE</span>
        </div>

        <div class="skeleton-masthead">
          <div class="skeleton-title"></div>
          <div class="skeleton-subtitle"></div>
        </div>

        <div class="skeleton-grid-3">
          <div class="skeleton-card">
            <div class="skeleton-line" style="width: 25%; height: 1.4rem; margin-bottom: 0.85rem;"></div>
            <div class="skeleton-line" style="width: 90%;"></div>
            <div class="skeleton-line" style="width: 100%;"></div>
            <div class="skeleton-line" style="width: 75%;"></div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton-line" style="width: 25%; height: 1.4rem; margin-bottom: 0.85rem;"></div>
            <div class="skeleton-line" style="width: 85%;"></div>
            <div class="skeleton-line" style="width: 100%;"></div>
            <div class="skeleton-line" style="width: 80%;"></div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton-line" style="width: 25%; height: 1.4rem; margin-bottom: 0.85rem;"></div>
            <div class="skeleton-line" style="width: 88%;"></div>
            <div class="skeleton-line" style="width: 95%;"></div>
            <div class="skeleton-line" style="width: 70%;"></div>
          </div>
        </div>

        <div class="skeleton-grid-4">
          <div class="skeleton-card">
            <div class="skeleton-line" style="width: 50%;"></div>
            <div class="skeleton-line" style="width: 70%; height: 1.5rem;"></div>
            <div class="skeleton-line" style="width: 60%;"></div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton-line" style="width: 50%;"></div>
            <div class="skeleton-line" style="width: 70%; height: 1.5rem;"></div>
            <div class="skeleton-line" style="width: 60%;"></div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton-line" style="width: 50%;"></div>
            <div class="skeleton-line" style="width: 70%; height: 1.5rem;"></div>
            <div class="skeleton-line" style="width: 60%;"></div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton-line" style="width: 50%;"></div>
            <div class="skeleton-line" style="width: 70%; height: 1.5rem;"></div>
            <div class="skeleton-line" style="width: 60%;"></div>
          </div>
        </div>
      `;
    }

    /**
     * 2. 에러(Error) Fallback UI 렌더링
     */
    function showErrorState(errorMessage) {
      const statusEl = document.getElementById('status-container');
      const reportContentEl = document.getElementById('report-content');

      reportContentEl.classList.add('is-hidden');
      statusEl.classList.remove('is-hidden');

      statusEl.innerHTML = `
        <header class="masthead">
          <div class="masthead-top-bar">
            <span>STATUS: DATA FEED INTERRUPTED</span>
            <span>SOURCE: ./data.json</span>
            <span>MODE: FALLBACK SAFE GUARD</span>
          </div>
          <h1 class="masthead-title">DAILY MACRO INTELLIGENCE BRIEF</h1>
          <p class="masthead-subtitle">Institutional Grade Financial &amp; Macroeconomic Analysis Dispatch</p>
        </header>

        <section class="error-fallback" role="alert">
          <span class="error-badge">DISPATCH RETRIEVAL ERROR</span>
          <h2 class="error-title">리포트 데이터를 불러오는 중 문제가 발생했습니다</h2>
          <p class="error-desc">
            외부 데이터 파일(<code>data.json</code>)을 패칭하거나 구문을 분석하는 데 실패했습니다.<br>
            네트워크 연결 상태 또는 데이터 파일 경로 및 JSON 형식을 확인한 뒤 다시 시도해 주세요.
          </p>
          <div class="error-detail">DIAGNOSTIC LOG: ${errorMessage}</div>
          <button type="button" class="retry-button" onclick="loadBriefData()">
            ↻ 새로고침 (RETRY DISPATCH)
          </button>
        </section>
      `;
    }

    /**
     * 3. 데이터 주도 자동 렌더링 함수 (Data-Driven Rendering)
     */
    function renderBrief(data) {
      if (!data || !data.report_metadata || !Array.isArray(data.macro_core_highlights) || !Array.isArray(data.market_indicators) || !Array.isArray(data.top_news_reports)) {
        throw new Error('Invalid JSON schema: 필수 리포트 데이터 구조가 누락되었습니다.');
      }

      const { report_metadata, macro_core_highlights, market_indicators, top_news_reports } = data;

      // 1. Masthead 렌더링
      const mastheadEl = document.getElementById('masthead-container');
      mastheadEl.innerHTML = `
        <div class="masthead-top-bar">
          <span>ISSUE DATE: ${report_metadata.display_date}</span>
          <span>TIMEZONE: ${report_metadata.timezone} | GENERATED: ${report_metadata.generated_at}</span>
          <span>VERSION: ${report_metadata.data_version}</span>
        </div>
        <h1 class="masthead-title">DAILY MACRO INTELLIGENCE BRIEF</h1>
        <p class="masthead-subtitle">Institutional Grade Financial &amp; Macroeconomic Analysis Dispatch</p>
      `;

      // 2. Macro Core Highlights 렌더링
      const highlightsEl = document.getElementById('highlights-container');
      highlightsEl.innerHTML = macro_core_highlights.map(item => `
        <article class="highlight-card">
          <span class="highlight-rank">${item.rank}</span>
          <h3 class="highlight-title">${item.title}</h3>
          <p class="highlight-summary">${item.summary}</p>
        </article>
      `).join('');

      // 3. Market Indicators 렌더링
      const indicatorsEl = document.getElementById('indicators-container');
      indicatorsEl.innerHTML = market_indicators.map(ind => {
        const isUp = ind.direction === 'UP';
        const arrow = isUp ? '▲' : '▼';
        const badgeClass = isUp ? 'badge-up' : 'badge-down';
        return `
          <div class="indicator-cell">
            <div class="indicator-top">
              <span class="indicator-name">${ind.name}</span>
              <span class="indicator-badge ${badgeClass}">${arrow} ${ind.change_percentage}</span>
            </div>
            <div class="indicator-value">${ind.value}</div>
            <div class="indicator-delta">
              <span>NET CHANGE: ${ind.change}</span>
              <span>(${ind.direction})</span>
            </div>
          </div>
        `;
      }).join('');

      // 4. Top 5 Intelligence Cards 렌더링
      const newsEl = document.getElementById('news-container');
      newsEl.innerHTML = top_news_reports.map(report => {
        const factsHtml = report.observed_facts
          .map(fact => `<li>${fact}</li>`)
          .join('');

        // 파급 경로의 '->' 구분자를 파싱하여 시각적 노드로 변환
        const steps = report.transmission_pathway.channel.split('->').map(s => s.trim());
        const pathwayNodesHtml = steps
          .map((step, idx) => `
            <span class="pathway-node">${step}</span>
            ${idx < steps.length - 1 ? '<span class="pathway-arrow">&rarr;</span>' : ''}
          `)
          .join('');

        return `
          <article class="news-card">
            <div class="news-card-header">
              <span class="news-meta">DISPATCH #0${report.id} // EQUITY &amp; MACRO RESEARCH</span>
              <h3 class="news-headline">${report.headline}</h3>
            </div>

            <div class="news-card-body">
              <!-- 1. 관측 팩트 (Observed Facts) -->
              <div class="sub-block">
                <div class="sub-block-label">
                  <span>1. 관측 팩트 (Observed Facts)</span>
                  <span>VERIFIED DATA</span>
                </div>
                <ul class="facts-list">
                  ${factsHtml}
                </ul>
              </div>

              <!-- 2. 파급 경로 (Transmission Pathway) -->
              <div class="sub-block pathway-block">
                <div class="sub-block-label">
                  <span>2. 파급 경로 (Transmission Pathway)</span>
                  <span>CAUSAL MECHANISM</span>
                </div>
                <div class="pathway-steps">
                  ${pathwayNodesHtml}
                </div>
                <p class="pathway-impact">
                  <strong>[IMPACT]</strong>${report.transmission_pathway.impact}
                </p>
              </div>

              <!-- 3. 기각 조건 (Falsification Criteria) -->
              <div class="sub-block falsification-block">
                <div class="sub-block-label">
                  <span>3. 기각 조건 (Falsification Criteria)</span>
                  <span>BOUNDARY CONDITION</span>
                </div>
                <p class="falsification-text">${report.falsification_condition}</p>
              </div>

              <!-- 4. 애널리스트 체크포인트/팁 (Analyst Tip) -->
              <div class="analyst-block">
                <span class="analyst-badge">4. Analyst Tip</span>
                <p class="analyst-text">${report.analyst_tip}</p>
              </div>
            </div>
          </article>
        `;
      }).join('');

      // 5. Footer 렌더링
      const footerEl = document.getElementById('footer-container');
      footerEl.innerHTML = `
        <div class="footer-meta">
          <span>MACHINE-READABLE INTELLIGENCE DIGEST // ${report_metadata.data_version}</span>
          <span>GENERATED AT: ${report_metadata.generated_at} (${report_metadata.timezone})</span>
        </div>
        <p class="footer-disclaimer">
          본 리포트는 정제된 시장 데이터 및 공시 정보를 기반으로 자동 생성된 거시·산업 인텔리전스 브리프입니다.
          제시된 파급 경로와 기각 조건은 애널리스트 검증 프레임워크에 따르며, 특정 금융상품에 대한 매수·매도 권유가 아닙니다.
        </p>
      `;

      // 렌더링 완료 후 스켈레톤 숨김 및 본문 노출
      document.getElementById('status-container').classList.add('is-hidden');
      document.getElementById('report-content').classList.remove('is-hidden');
    }

    // 기존 함수명 호환성 유지
    const renderReport = renderBrief;

    /**
     * 4. 비동기 데이터 패칭 파이프라인 (Async/Await & Cache-Busting)
     */
    async function loadBriefData() {
      showLoadingState();

      try {
        const cacheBusterUrl = `./data.json?v=${new Date().getTime()}`;
        const response = await fetch(cacheBusterUrl, {
          cache: 'no-store',
          headers: {
            'Accept': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status} (${response.statusText || '데이터 파일을 찾을 수 없습니다'})`);
        }

        const rawText = await response.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch (parseErr) {
          throw new Error(`JSON Parsing Failed: ${parseErr.message}`);
        }

        renderBrief(data);
      } catch (error) {
        console.error('[Daily Macro Brief] Failed to load data.json:', error);
        showErrorState(error.message || 'Unknown Network / Fetch Error');
      }
    }

    // 페이지 로드 시 비동기 데이터 패칭 실행
    document.addEventListener('DOMContentLoaded', loadBriefData);
  </script>
</body>
</html>
