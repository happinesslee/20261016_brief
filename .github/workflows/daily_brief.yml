name: Daily Economic Intelligence Brief Update

on:
  schedule:
    # 매일 한국 시간(KST) 오전 06:00 실행 (UTC 기준 전일 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHub Actions 탭에서 수동 즉시 실행 지원

permissions:
  contents: write

jobs:
  update-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Intelligence Data Pipeline (RSS + Market + Gemini API)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: Asia/Seoul
        run: |
          python scripts/update_brief.py

      - name: Commit and Push Updated data.json
        env:
          TZ: Asia/Seoul
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet data.json; then
            echo "data.json에 변경 사항이 없습니다. 커밋을 건너뜁니다."
            exit 0
          fi

          CURRENT_DATE=$(date +'%Y-%m-%d %H:%M KST')
          git add data.json
          git commit -m "chore(data): update daily economic intelligence brief (${CURRENT_DATE})"
          git pull --rebase origin main
          git push origin main

